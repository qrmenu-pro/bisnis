<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Menu Pelanggan - QRMenu-Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- HEADER ELEGAN & DINAMIS -->
    <header class="bg-gradient-to-r from-amber-700 to-amber-600 text-white shadow-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div>
            <h1 id="namaTokoTitle" class="text-lg font-extrabold tracking-tight">🍽️ Katalog Menu</h1>
            <p class="text-[11px] text-amber-100 opacity-90">Silakan pilih menu favorit Anda di bawah ini</p>
        </div>
        <div class="text-xs bg-white/20 text-white px-3.5 py-1.5 rounded-full font-bold backdrop-blur-sm border border-white/30">
            🟢 Live Order
        </div>
    </header>

    <!-- MAIN KONTEN LIST MENU -->
    <main class="max-w-2xl mx-auto px-4 py-6 flex-1 w-full space-y-4">
        <div class="mb-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Daftar Menu Tersedia</h2>
        </div>
        
        <div id="gridKatalog" class="space-y-3">
            <div class="bg-white p-6 rounded-2xl border text-center text-slate-400">Memuat katalog menu...</div>
        </div>
    </main>

    <!-- FOOTER: METODE PEMBAYARAN KE TOKO -->
    <footer class="bg-white border-t mt-12 py-6 px-6 shadow-inner">
        <div class="max-w-2xl mx-auto space-y-3 text-xs">
            <h3 class="font-bold text-slate-900 text-sm flex items-center gap-1.5">💳 Informasi & Metode Pembayaran Toko</h3>
            <div id="infoPayment" class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2 text-slate-600">
                <p>Memuat informasi pembayaran...</p>
            </div>
            <p class="text-[10px] text-center text-slate-400 pt-2">Powered by QRMenu-Pro Enterprise SaaS</p>
        </div>
    </footer>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxi7tce2iHuEPgYggs2ECsjgMJUWyA071G-tDUeNKuiw14lcdE-H9n2BdMLf68PPaHQ/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const currentResto = urlParams.get('resto') || "Cafe_Rokstars";

        // Tampilkan Nama Toko di Header
        document.getElementById('namaTokoTitle').innerText = `🍽️ ${currentResto.replace(/_/g, ' ')}`;

        // Kirim Sinyal Geolokasi Tamu ke Sistem (Untuk Panel Klien)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                // Simpan koordinat lokal tamu untuk sesi order
                localStorage.setItem('tamu_lat', lat);
                localStorage.setItem('tamu_lon', lon);
            }, () => {}, { enableHighAccuracy: true });
        }

        // Ambil Data Menu (List Layout)
        fetch(`${GAS_URL}?action=getMenu&resto=${encodeURIComponent(currentResto)}`)
        .then(res => res.json())
        .then(resData => {
            const grid = document.getElementById('gridKatalog');
            let data = resData.data || [];
            if(data.length === 0) {
                grid.innerHTML = `<div class="bg-white p-6 rounded-2xl border text-center text-slate-400">Menu belum tersedia untuk saat ini.</div>`;
                return;
            }
            grid.innerHTML = "";
            data.forEach(item => {
                let badge = item.kategori === 'Minuman' ? 'bg-blue-100 text-blue-800' : 'bg-rose-100 text-rose-800';
                grid.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex gap-4 items-center hover:shadow-md transition">
                        <img src="${item.gambar_url}" class="w-24 h-24 object-cover rounded-xl shadow-sm flex-shrink-0" alt="Menu">
                        <div class="flex-1 min-w-0">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${badge}">${item.kategori}</span>
                            <h3 class="font-bold text-sm text-slate-900 mt-1 truncate">${item.nama_menu}</h3>
                            <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${item.deskripsi}</p>
                            <div class="flex justify-between items-center mt-3">
                                <span class="font-extrabold text-amber-700 text-sm">Rp ${parseInt(item.harga_jual).toLocaleString()}</span>
                                <button onclick="alert('Pesanan ${item.nama_menu} dipilih!')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm transition">Pesan</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        // Ambil Data Pengaturan Payment (Bank & QRIS Barcode)
        fetch(`${GAS_URL}?action=getSettingPayment&resto=${encodeURIComponent(currentResto)}`)
        .then(res => res.json())
        .then(resData => {
            const payBox = document.getElementById('infoPayment');
            let pay = resData.data;
            if(!pay || !pay.bank) {
                payBox.innerHTML = `<p>Pembayaran Tunai / Cash langsung ke Kasir / Pelayan.</p>`;
                return;
            }
            payBox.innerHTML = `
                <div class="flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-800">🏦 Transfer ${pay.bank} : <span class="font-mono text-amber-700">${pay.norek}</span></p>
                        <p class="text-slate-500">Atas Nama: <span class="font-semibold text-slate-700">${pay.an}</span></p>
                    </div>
                </div>
                ${pay.qris_url ? `<div class="mt-3 pt-3 border-t border-slate-200 text-center"><p class="font-bold mb-2">Scan QRIS Pembayaran:</p><img src="${pay.qris_url}" class="w-32 h-32 object-contain mx-auto rounded-xl border bg-white p-1"></div>` : ''}
            `;
        });
    </script>
</body>
</html>
