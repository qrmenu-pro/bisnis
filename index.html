<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Menu Pelanggan - QRMenu-Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 id="namaTokoTitle" class="text-lg font-extrabold text-amber-700">🍽️ Katalog Menu</h1>
        <div id="infoMeja" class="text-xs bg-amber-50 text-amber-800 px-3 py-1.5 rounded-full font-bold border border-amber-200">Silakan Pilih Pesanan</div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        <div id="gridKatalog" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-center col-span-2 text-slate-400 py-10">Memuat katalog menu...</p>
        </div>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxWFYakEtuJanhbjHm0fhFfuTbAvkxAH8b-9fTtrN8JzcLmU8-8_LGdf3IsxeG8eHCM/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const currentResto = urlParams.get('resto') || "Cafe_Rokstars";

        document.getElementById('namaTokoTitle').innerText = `🍽️ Katalog: ${currentResto.replace(/_/g, ' ')}`;

        fetch(`${GAS_URL}?action=getMenu&resto=${encodeURIComponent(currentResto)}`)
        .then(res => res.json())
        .then(resData => {
            const grid = document.getElementById('gridKatalog');
            let data = resData.data || [];
            if(data.length === 0) {
                grid.innerHTML = `<p class="text-center col-span-2 text-slate-400 py-10">Menu belum tersedia untuk saat ini.</p>`;
                return;
            }
            grid.innerHTML = "";
            data.forEach(item => {
                let badge = item.kategori === 'Minuman' ? 'bg-blue-100 text-blue-800' : 'bg-rose-100 text-rose-800';
                grid.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex gap-4 items-center">
                        <img src="${item.gambar_url}" class="w-24 h-24 object-cover rounded-xl" alt="Menu">
                        <div class="flex-1">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${badge}">${item.kategori}</span>
                            <h3 class="font-bold text-sm text-slate-900 mt-1">${item.nama_menu}</h3>
                            <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${item.deskripsi}</p>
                            <div class="flex justify-between items-center mt-3">
                                <span class="font-extrabold text-amber-700 text-sm">Rp ${parseInt(item.harga_jual).toLocaleString()}</span>
                                <button onclick="alert('Pesanan produk ${item.nama_menu} dipilih!')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl">Pesan</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
