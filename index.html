<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Menu Pelanggan - QRMenu-Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 1. HALAMAN FORM MASUK AWAL (MEJA & WA) -->
    <div id="sectionFormAwal" class="min-h-screen flex items-center justify-center p-6 bg-slate-900 relative">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center">
                <div class="h-16 w-16 bg-amber-600 text-white rounded-2xl mx-auto flex items-center justify-center font-bold text-xl shadow-lg mb-3">QR</div>
                <h2 id="titleWelcomeResto" class="text-xl font-extrabold text-slate-900">Selamat Datang</h2>
                <p class="text-xs text-slate-500 mt-1">Silakan masukkan Nomor Meja & WhatsApp untuk mulai memesan</p>
            </div>

            <form id="formAwalOrder" class="space-y-4 text-xs">
                <div>
                    <label class="block font-semibold mb-1 uppercase tracking-wider text-slate-600">Nomor Meja</label>
                    <input type="text" id="inputNoMeja" required placeholder="Cth: Meja 05 / Takeaway" class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:border-amber-600 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1 uppercase tracking-wider text-slate-600">Nomor WhatsApp</label>
                    <input type="text" id="inputWaPemesan" required placeholder="08123456789" class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:border-amber-600 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-amber-600/30">
                    Mulai Pilih Menu 🍽️
                </button>
            </form>
        </div>
    </div>

    <!-- 2. HALAMAN UTAMA KATALOG MENU -->
    <div id="sectionKatalogMenu" class="hidden min-h-screen flex flex-col pb-24">
        <header class="bg-gradient-to-r from-amber-700 to-amber-600 text-white shadow-md sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
            <div>
                <h1 id="namaTokoTitle" class="text-lg font-extrabold tracking-tight">🍽️ Katalog Menu</h1>
                <p id="infoPelangganHeader" class="text-[11px] text-amber-100 opacity-90">Meja: - | WA: -</p>
            </div>
            <div class="text-xs bg-white/20 text-white px-3.5 py-1.5 rounded-full font-bold backdrop-blur-sm border border-white/30">
                🟢 Live Order
            </div>
        </header>

        <main class="max-w-2xl mx-auto px-4 py-6 flex-1 w-full space-y-4">
            <div class="mb-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Daftar Menu Tersedia</h2>
            </div>
            
            <div id="gridKatalog" class="space-y-3">
                <div class="bg-white p-6 rounded-2xl border text-center text-slate-400">Memuat katalog menu...</div>
            </div>
        </main>

        <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-6 py-4 z-50 shadow-lg">
            <div class="max-w-2xl mx-auto flex justify-between items-center">
                <div>
                    <span class="text-[11px] uppercase font-bold text-slate-400 block tracking-wider">Total Harga Pesanan</span>
                    <span id="grandTotal" class="text-lg font-extrabold text-amber-700">Rp 0</span>
                </div>
                <button onclick="bukaModalCheckout()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-3 rounded-2xl shadow-lg transition text-sm flex items-center gap-2">
                    🛒 Order Sekarang
                </button>
            </div>
        </div>
    </div>

    <!-- 3. MODAL PEMBAYARAN & KONFIRMASI -->
    <div id="modalCheckout" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-bold text-slate-900">💳 Pilih Metode Pembayaran</h3>
                <button onclick="tutupModalCheckout()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">✕</button>
            </div>

            <div class="space-y-3 text-xs">
                <label class="block font-semibold text-slate-700">Metode Pembayaran ke Toko</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="pilihMetode('Transfer')" id="btnTransfer" class="p-3 border rounded-xl font-bold text-center transition bg-amber-50 border-amber-600 text-amber-700">🏦 Transfer Bank</button>
                    <button type="button" onclick="pilihMetode('QRIS')" id="btnQris" class="p-3 border rounded-xl font-bold text-center transition bg-white border-slate-200 text-slate-600">📱 QRIS</button>
                    <button type="button" onclick="pilihMetode('Cash')" id="btnCash" class="p-3 border rounded-xl font-bold text-center transition bg-white border-slate-200 text-slate-600">💵 Cash di Kasir</button>
                </div>
            </div>

            <div id="detailPaymentBox" class="p-4 bg-slate-50 rounded-2xl border space-y-2 text-xs text-slate-700">
                <p class="font-bold">Informasi Rekening Toko:</p>
                <p id="infoBankText">Memuat informasi pembayaran...</p>
                <div id="qrisContainer" class="text-center pt-2"></div>
            </div>

            <button onclick="prosesKirimOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg transition">
                Konfirmasi & Kirim Pesanan Sekarang 🚀
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxi7tce2iHuEPgYggs2ECsjgMJUWyA071G-tDUeNKuiw14lcdE-H9n2BdMLf68PPaHQ/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const currentResto = urlParams.get('resto') || "Cafe_Rokstars";

        document.getElementById('titleWelcomeResto').innerText = `Katalog ${currentResto.replace(/_/g, ' ')}`;

        let dataPemesan = { meja: "", wa: "" };
        let menuData = [];
        let keranjang = {};
        let metodeBayarPilihan = "Transfer";
        let paymentInfoData = {};
        let tokoWaKontak = "6285222952220"; // Nomor WhatsApp default toko

        // Fungsi Bunyi Notifikasi (Audio Beep)
        function putarSuaraNotifikasi() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nada D5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        document.getElementById('formAwalOrder').addEventListener('submit', function(e) {
            e.preventDefault();
            dataPemesan.meja = document.getElementById('inputNoMeja').value.trim();
            dataPemesan.wa = document.getElementById('inputWaPemesan').value.trim();

            if(!dataPemesan.meja || !dataPemesan.wa) {
                alert("Nomor Meja dan WhatsApp wajib diisi!");
                return;
            }

            document.getElementById('sectionFormAwal').classList.add('hidden');
            document.getElementById('sectionKatalogMenu').classList.remove('hidden');

            document.getElementById('namaTokoTitle').innerText = `🍽️ ${currentResto.replace(/_/g, ' ')}`;
            document.getElementById('infoPelangganHeader').innerText = `Meja: ${dataPemesan.meja} | WA: ${dataPemesan.wa}`;

            muatDataKatalogDanPayment();
        });

        function muatDataKatalogDanPayment() {
            fetch(`${GAS_URL}?action=getMenu&resto=${encodeURIComponent(currentResto)}`)
            .then(res => res.json())
            .then(resData => {
                menuData = resData.data || [];
                renderKatalog();
            });

            fetch(`${GAS_URL}?action=getSettingPayment&resto=${encodeURIComponent(currentResto)}`)
            .then(res => res.json())
            .then(resData => {
                paymentInfoData = resData.data || {};
                updatePaymentDetailBox();
            });
        }

        function renderKatalog() {
            const grid = document.getElementById('gridKatalog');
            if(menuData.length === 0) {
                grid.innerHTML = `<div class="bg-white p-6 rounded-2xl border text-center text-slate-400">Menu belum tersedia.</div>`;
                return;
            }
            grid.innerHTML = "";
            menuData.forEach(item => {
                let badge = item.kategori === 'Minuman' ? 'bg-blue-100 text-blue-800' : 'bg-rose-100 text-rose-800';
                let qty = keranjang[item.id_menu] || 0;

                let rawImg = item.gambar_url ? item.gambar_url.trim() : "";
                let imgSrc = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c';
                if (rawImg.startsWith('http')) {
                    if (rawImg.includes('drive.google.com') && rawImg.includes('id=')) {
                        let fileId = rawImg.split('id=')[1].split('&')[0];
                        imgSrc = `https://lh3.googleusercontent.com/d/${fileId}`;
                    } else {
                        imgSrc = rawImg;
                    }
                }

                grid.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex gap-4 items-center">
                        <img src="${imgSrc}" class="w-24 h-24 object-cover rounded-xl shadow-sm flex-shrink-0 bg-slate-100" alt="Menu" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c'">
                        <div class="flex-1 min-w-0">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${badge}">${item.kategori}</span>
                            <h3 class="font-bold text-sm text-slate-900 mt-1 truncate">${item.nama_menu}</h3>
                            <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${item.deskripsi}</p>
                            <div class="flex justify-between items-center mt-3">
                                <span class="font-extrabold text-amber-700 text-sm">Rp ${parseInt(item.harga_jual).toLocaleString()}</span>
                                <div class="flex items-center gap-2">
                                    <button onclick="ubahQty('${item.id_menu}', -1)" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-lg font-bold text-slate-700 flex items-center justify-center">-</button>
                                    <span id="qty_${item.id_menu}" class="font-bold text-xs w-6 text-center">${qty}</span>
                                    <button onclick="ubahQty('${item.id_menu}', 1)" class="w-8 h-8 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold flex items-center justify-center">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function ubahQty(id, delta) {
            if (!keranjang[id]) keranjang[id] = 0;
            keranjang[id] += delta;
            if (keranjang[id] < 0) keranjang[id] = 0;

            document.getElementById(`qty_${id}`).innerText = keranjang[id];
            hitungTotalHarga();
        }

        function hitungTotalHarga() {
            let total = 0;
            menuData.forEach(item => {
                let qty = keranjang[item.id_menu] || 0;
                total += qty * parseInt(item.harga_jual);
            });
            document.getElementById('grandTotal').innerText = `Rp ${total.toLocaleString()}`;
        }

        function bukaModalCheckout() {
            let totalItem = Object.values(keranjang).reduce((a, b) => a + b, 0);
            if(totalItem === 0) {
                alert("Silakan pilih minimal 1 menu terlebih dahulu!");
                return;
            }
            document.getElementById('modalCheckout').classList.remove('hidden');
        }

        function tutupModalCheckout() {
            document.getElementById('modalCheckout').classList.add('hidden');
        }

        function pilihMetode(metode) {
            metodeBayarPilihan = metode;
            ['Transfer', 'Qris', 'Cash'].forEach(m => {
                let btn = document.getElementById('btn' + m);
                if(m === metode) {
                    btn.className = "p-3 border rounded-xl font-bold text-center transition bg-amber-50 border-amber-600 text-amber-700";
                } else {
                    btn.className = "p-3 border rounded-xl font-bold text-center transition bg-white border-slate-200 text-slate-600";
                }
            });
            updatePaymentDetailBox();
        }

        function updatePaymentDetailBox() {
            const infoText = document.getElementById('infoBankText');
            const qrisContainer = document.getElementById('qrisContainer');

            if(metodeBayarPilihan === 'Cash') {
                infoText.innerHTML = `Pembayaran dilakukan secara tunai/cash langsung di kasir toko saat pesanan diterima.`;
                qrisContainer.innerHTML = "";
            } else if(metodeBayarPilihan === 'Transfer') {
                if(paymentInfoData.bank) {
                    infoText.innerHTML = `Transfer ke <b>${paymentInfoData.bank}</b> : <span class="font-mono text-amber-700">${paymentInfoData.norek}</span><br>Atas Nama: ${paymentInfoData.an}`;
                } else {
                    infoText.innerHTML = `Rekening bank belum diatur oleh toko.`;
                }
                qrisContainer.innerHTML = "";
            } else if(metodeBayarPilihan === 'QRIS') {
                infoText.innerHTML = `Scan barcode QRIS di bawah ini melalui aplikasi e-wallet / mobile banking Anda.`;
                if(paymentInfoData.qris_url) {
                    let rawQris = paymentInfoData.qris_url.trim();
                    let qrisSrc = rawQris;
                    if(rawQris.includes('drive.google.com') && rawQris.includes('id=')) {
                        let fileId = rawQris.split('id=')[1].split('&')[0];
                        qrisSrc = `https://lh3.googleusercontent.com/d/${fileId}`;
                    }
                    qrisContainer.innerHTML = `<img src="${qrisSrc}" class="w-32 h-32 object-contain mx-auto rounded-xl border bg-white p-1 mt-2">`;
                } else {
                    qrisContainer.innerHTML = `<p class="text-rose-500 font-semibold mt-2">Barcode QRIS belum di-upload oleh toko.</p>`;
                }
            }
        }

        function prosesKirimOrder() {
            let detailPesananArr = [];
            let grandTotalNum = 0;
            menuData.forEach(item => {
                let qty = keranjang[item.id_menu] || 0;
                if(qty > 0) {
                    let subtotal = qty * parseInt(item.harga_jual);
                    grandTotalNum += subtotal;
                    detailPesananArr.push(`- ${item.nama_menu} (${qty}x) = Rp ${subtotal.toLocaleString()}`);
                }
            });

            let teksDetail = detailPesananArr.join('\n');
            let totalStr = `Rp ${grandTotalNum.toLocaleString()}`;

            let payloadOrder = {
                action: 'simpanOrderMasuk',
                resto: currentResto,
                nama_pemesan: `Tamu (${dataPemesan.wa})`,
                nomor_wa: dataPemesan.wa,
                detail_pesanan: detailPesananArr.join(', '),
                total_harga: totalStr,
                nomor_meja: dataPemesan.meja,
                metode_bayar: metodeBayarPilihan
            };

            // Kirim ke database GAS agar langsung masuk panel hijau Admin Klien
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payloadOrder)
            }).then(() => {
                // Bunyikan Suara Notifikasi Beep
                putarSuaraNotifikasi();
                tutupModalCheckout();

                if(metodeBayarPilihan === 'Transfer' || metodeBayarPilihan === 'QRIS') {
                    let pesanWa = `Halo Admin ${currentResto.replace(/_/g, ' ')}, saya ingin konfirmasi pembayaran pesanan.%0A%0A*No Meja:* ${dataPemesan.meja}%0A*No WA:* ${dataPemesan.wa}%0A*Metode:* ${metodeBayarPilihan}%0A%0A*Daftar Pesanan:*%0A${encodeURIComponent(teksDetail)}%0A%0A*Total:* *${totalStr}*%0A%0A(Berikut saya lampirkan bukti transfer/pembayaran)`;
                    
                    let urlWa = `https://wa.me/${tokoWaKontak}?text=${pesanWa}`;
                    
                    if(confirm("Pesanan berhasil dikirim ke toko!\n\nKlik OK untuk langsung konfirmasi pembayaran & kirim bukti transfer ke WhatsApp Toko.")) {
                        window.open(urlWa, '_blank');
                    }
                } else {
                    alert(`Pesanan Berhasil Dikirim!\nMeja: ${dataPemesan.meja}\nTotal: ${totalStr}\nMetode: Cash di Kasir.\n\nSilakan menunggu pesanan di meja Anda.`);
                }

                keranjang = {};
                renderKatalog();
                hitungTotalHarga();
            }).catch(() => {
                alert("Gagal mengirim pesanan. Periksa koneksi internet Anda.");
            });
        }
    </script>
</body>
</html>
