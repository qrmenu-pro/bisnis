<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Pemesanan - QRMenu Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-32 selection:bg-amber-500 selection:text-white">

    <!-- Header Universal & Elegan -->
    <header class="glass-nav border-b border-slate-200 sticky top-0 z-40 px-6 py-4 shadow-sm">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 bg-gradient-to-tr from-amber-500 to-amber-600 rounded-2xl flex items-center justify-center font-bold text-white shadow-md shadow-amber-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div>
                    <h1 id="namaBisnisTitle" class="text-base font-bold tracking-tight text-slate-900">Memuat Bisnis...</h1>
                    <span class="text-xs text-amber-600 font-semibold tracking-wide uppercase">Digital Katalog & Pemesanan</span>
                </div>
            </div>
            <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs px-3.5 py-1.5 rounded-full font-semibold">
                Layanan Mandiri
            </div>
        </div>
    </header>

    <!-- Daftar Menu Katalog -->
    <main class="max-w-3xl mx-auto px-6 py-8">
        <div class="mb-6">
            <h2 class="text-xl font-bold tracking-tight text-slate-900">Katalog Produk / Menu</h2>
            <p class="text-xs text-slate-500 mt-0.5">Pilih item yang Anda inginkan untuk langsung diproses.</p>
        </div>

        <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Loading State -->
            <div class="col-span-2 text-center py-16 text-slate-400 text-sm">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent mb-3"></div>
                <p>Mengambil data dari database bisnis...</p>
            </div>
        </div>
    </main>

    <!-- Floating Cart / Checkout Bar -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 glass-nav border-t border-slate-200 p-5 shadow-2xl z-50 hidden transition-all duration-300">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 block">Total Pembayaran</span>
                <span id="totalHarga" class="text-xl font-bold text-amber-600">Rp 0</span>
            </div>
            <button onclick="bukaModalCheckout()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold px-7 py-3 rounded-2xl text-sm transition shadow-lg shadow-amber-500/20">
                Checkout Pesanan
            </button>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="checkoutModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-6">
        <div class="bg-white border border-slate-200 rounded-3xl p-7 w-full max-w-md shadow-2xl relative overflow-hidden">
            <h3 class="text-lg font-bold text-slate-900 mb-1">Konfirmasi Pesanan</h3>
            <p class="text-xs text-slate-500 mb-6">Masukkan identitas Anda agar pesanan dapat segera diproses.</p>
            
            <form id="formCheckout" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Nama Pemesan</label>
                    <input type="text" id="namaTamu" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-500 transition" placeholder="Cth: Budi Santoso">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Nomor WhatsApp / HP</label>
                    <input type="text" id="nohpTamu" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-500 transition" placeholder="Cth: 08123456789">
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" onclick="tutupModalCheckout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-5 py-3 rounded-xl transition">Batal</button>
                    <button type="submit" id="btnKirimOrder" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-7 py-3 rounded-xl transition shadow-lg shadow-amber-500/20">Kirim Pesanan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logika -->
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxWFYakEtuJanhbjHm0fhFfuTbAvkxAH8b-9fTtrN8JzcLmU8-8_LGdf3IsxeG8eHCM/exec";
        
        const urlParams = new URLSearchParams(window.location.search);
        const currentResto = urlParams.get('resto');

        let menuList = [];
        let cart = {}; 

        if (!currentResto) {
            document.getElementById('namaBisnisTitle').innerText = "Pilih Bisnis";
            document.getElementById('menuContainer').innerHTML = `
                <div class="col-span-2 text-center py-12 bg-white border border-slate-200 rounded-3xl shadow-sm p-8">
                    <h3 class="font-bold text-slate-900 text-base mb-2">Akses Memerlukan Link Spesifik Bisnis</h3>
                    <p class="text-xs text-slate-500 mb-4">Silakan gunakan link atau scan QR code resmi yang diberikan oleh masing-masing merchant/bisnis.</p>
                    <div class="flex max-w-sm mx-auto gap-2">
                        <input type="text" id="inputManualResto" placeholder="Atau ketik nama bisnis..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                        <button onclick="bukaBisnisManual()" class="bg-amber-500 text-white text-xs font-bold px-4 py-2 rounded-xl">Buka</button>
                    </div>
                </div>`;
        } else {
            document.getElementById('namaBisnisTitle').innerText = currentResto.replace(/_/g, ' ');
            loadMenuResto();
        }

        function bukaBisnisManual() {
            const val = document.getElementById('inputManualResto').value.trim();
            if (val) {
                window.location.href = `?resto=${encodeURIComponent(val)}`;
            }
        }

        function loadMenuResto() {
            fetch(`${GAS_URL}?action=getMenu&resto=${encodeURIComponent(currentResto)}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    menuList = data.data;
                    renderMenu();
                } else {
                    document.getElementById('menuContainer').innerHTML = `<div class="col-span-2 text-center text-rose-500 text-sm py-16 bg-white border border-slate-200 rounded-3xl shadow-sm">Bisnis "${currentResto}" tidak ditemukan di database. Pastikan nama sudah terdaftar.</div>`;
                }
            })
            .catch(() => {
                document.getElementById('menuContainer').innerHTML = `<div class="col-span-2 text-center text-rose-500 text-sm py-16 bg-white border border-slate-200 rounded-3xl shadow-sm">Kesalahan koneksi ke server pusat.</div>`;
            });
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            if (menuList.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-slate-400 text-sm py-16 bg-white border border-slate-200 rounded-3xl shadow-sm">Belum ada menu/produk yang tersedia di bisnis ini.</div>`;
                return;
            }

            container.innerHTML = "";
            menuList.forEach(item => {
                const qty = cart[item.id_menu] || 0;
                container.innerHTML += `
                    <div class="bg-white border border-slate-200/80 rounded-3xl p-4 flex gap-4 items-center shadow-sm hover:shadow-md transition">
                        <img src="${item.gambar_url || 'https://via.placeholder.com/150'}" class="w-24 h-24 object-cover rounded-2xl bg-slate-100 flex-shrink-0 border border-slate-100" alt="Produk">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-bold text-slate-900 truncate">${item.nama_menu}</h4>
                            <p class="text-xs text-slate-500 line-clamp-2 mt-1 leading-relaxed">${item.deskripsi}</p>
                            <div class="text-amber-600 font-bold text-sm mt-2">Rp ${Number(item.harga_jual).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="flex flex-col items-center justify-center gap-1.5 bg-slate-50 p-1.5 rounded-2xl border border-slate-200">
                            <button onclick="ubahJumlah('${item.id_menu}', 1)" class="bg-amber-500 hover:bg-amber-600 text-white w-8 h-8 rounded-xl font-bold text-sm flex items-center justify-center transition shadow-sm">+</button>
                            <span class="text-xs font-bold text-slate-800 py-0.5" id="qty-${item.id_menu}">${qty}</span>
                            <button onclick="ubahJumlah('${item.id_menu}', -1)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 w-8 h-8 rounded-xl font-bold text-sm flex items-center justify-center transition">-</button>
                        </div>
                    </div>
                `;
            });
        }

        function ubahJumlah(idMenu, delta) {
            if (!cart[idMenu]) cart[idMenu] = 0;
            cart[idMenu] += delta;
            if (cart[idMenu] < 0) cart[idMenu] = 0;
            if (cart[idMenu] === 0) delete cart[idMenu];

            document.getElementById(`qty-${idMenu}`).innerText = cart[idMenu] || 0;
            updateCartBar();
        }

        function updateCartBar() {
            let totalItem = 0;
            let totalPrice = 0;

            for (let id in cart) {
                const item = menuList.find(m => m.id_menu === id);
                if (item) {
                    totalItem += cart[id];
                    totalPrice += (cart[id] * Number(item.harga_jual));
                }
            }

            document.getElementById('totalHarga').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            const cartBar = document.getElementById('cartBar');
            if (totalItem > 0) {
                cartBar.classList.remove('hidden');
            } else {
                cartBar.classList.add('hidden');
            }
        }

        function bukaModalCheckout() {
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function tutupModalCheckout() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        document.getElementById('formCheckout').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnKirimOrder');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            let detailStr = "";
            let grandTotal = 0;
            for (let id in cart) {
                const item = menuList.find(m => m.id_menu === id);
                if (item) {
                    detailStr += `${item.nama_menu} (${cart[id]}x), `;
                    grandTotal += (cart[id] * Number(item.harga_jual));
                }
            }

            const payload = {
                action: 'tambahPesanan',
                resto: currentResto,
                nama_tamu: document.getElementById('namaTamu').value,
                no_hp: document.getElementById('nohpTamu').value,
                detail_pesanan: detailStr,
                total: grandTotal
            };

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('Pesanan berhasil dikirim ke sistem bisnis!');
                cart = {};
                tutupModalCheckout();
                location.reload();
            })
            .catch(err => {
                alert('Gagal mengirim pesanan: ' + err);
                btn.disabled = false;
                btn.innerText = "Kirim Pesanan";
            });
        });
    </script>
</body>
</html>
